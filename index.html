<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drake Browser – Serverless Proxy</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #7289da;
            --danger: #f04747;
            --success: #43b581;
            --warning: #faa61a;
            --tab-height: 36px;
            --toolbar-height: 44px;
            --radius: 8px;
        }
        .light {
            --bg: #ffffff;
            --surface: #f2f3f5;
            --border: #d0d0d5;
            --text: #1e1e2e;
            --accent: #5865f2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }
        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            height: var(--toolbar-height);
            padding: 4px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            gap: 6px;
            flex-shrink: 0;
            z-index: 2;
        }
        .nav-btn, .action-btn {
            width: 28px; height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .nav-btn:hover, .action-btn:hover { background: rgba(128,128,128,0.2); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }
        .address-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            height: 32px;
            padding: 0 12px;
            transition: border-color 0.2s;
        }
        .address-bar:focus-within { border-color: var(--accent); }
        .address-input {
            background: transparent;
            border: none; outline: none;
            color: var(--text);
            font-size: 13px;
            width: 100%;
        }
        .go-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            height: 28px;
            white-space: nowrap;
        }
        .go-btn:hover { filter: brightness(1.1); }
        .mode-btn {
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .theme-toggle { margin-left: 4px; cursor: pointer; font-size: 18px; }

        /* Tab bar */
        .tab-bar {
            display: flex;
            align-items: flex-end;
            background: var(--surface);
            padding: 4px 8px 0;
            gap: 2px;
            overflow-x: auto;
            min-height: 40px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            z-index: 1;
        }
        .tab {
            display: flex;
            align-items: center;
            background: #21262d;
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 6px 12px;
            font-size: 12px;
            color: #8b949e;
            cursor: pointer;
            white-space: nowrap;
            max-width: 200px;
            transition: all 0.15s;
            height: 32px;
            user-select: none;
        }
        .light .tab { background: #e0e0e8; color: #555; }
        .tab.active {
            background: var(--bg);
            color: var(--text);
            border-bottom: 1px solid var(--bg);
            margin-bottom: -1px;
        }
        .tab:hover:not(.active) { background: #30363d; }
        .light .tab:hover:not(.active) { background: #c0c0c8; }
        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 6px;
        }
        .close-tab {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .tab:hover .close-tab { opacity: 1; }
        .close-tab:hover { background: #444; color: #fff; }
        .new-tab-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 18px;
            cursor: pointer;
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .new-tab-btn:hover { background: #30363d; color: #fff; }

        /* Bookmark bar */
        .bookmark-bar {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 4px 12px;
            gap: 12px;
            overflow-x: auto;
            font-size: 12px;
            flex-shrink: 0;
            z-index: 0;
            white-space: nowrap;
        }
        .bookmark {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }
        .bookmark:hover { text-decoration: underline; }

        /* Content area */
        .content {
            flex: 1;
            position: relative;
            background: #fff;
            overflow: hidden;
        }
        .content.dark-bg { background: #1e1e2e; }
        iframe.proxy-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .status-message {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            font-size: 14px;
            background: var(--bg);
            flex-direction: column;
            padding: 2rem;
        }
        .error-details {
            background: var(--surface);
            color: var(--text);
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            max-width: 480px;
            text-align: center;
        }
        .retry-btn {
            margin-top: 12px;
            padding: 6px 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Home page styling */
        .home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            text-align: center;
            padding: 2rem;
        }
        .home-page h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .home-page input {
            width: 100%;
            max-width: 500px;
            padding: 0.8rem 1.2rem;
            border: 2px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            color: var(--text);
            font-size: 16px;
            margin: 1rem 0;
            outline: none;
        }
        .home-page input:focus { border-color: var(--accent); }
        .quick-links {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .quick-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: var(--text);
            text-decoration: none;
            transition: transform 0.1s;
        }
        .quick-link:hover { transform: translateY(-2px); }
        .quick-link .icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .quick-link span { font-size: 12px; }

        /* Console */
        .console-panel {
            display: none;
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .console-panel.open { display: block; }
        .console-entry { margin: 2px 0; word-break: break-all; }
        .console-entry.error { color: var(--danger); }
        .console-entry.info { color: var(--accent); }

        @media (max-width: 600px) {
            .address-bar { display: none; }
            .toolbar { justify-content: space-between; }
        }
    </style>
</head>
<body class="light">
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="nav-buttons">
            <button class="nav-btn" id="backBtn" title="Back" disabled>◀</button>
            <button class="nav-btn" id="forwardBtn" title="Forward" disabled>▶</button>
        </div>
        <div class="address-bar">
            <span style="color:#888;">🔒</span>
            <input type="text" class="address-input" id="addressInput" placeholder="Search or enter URL…" autofocus>
        </div>
        <button class="go-btn" id="goBtn">Go</button>
        <button class="action-btn" id="refreshBtn" title="Refresh">↻</button>
        <button class="mode-btn" id="modeToggle">
            <span id="modeIcon">⚡</span> <span id="modeLabel">Proxy</span>
        </button>
        <span class="theme-toggle" id="themeToggle">🌙</span>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar" id="tabBar"></div>

    <!-- Bookmark bar -->
    <div class="bookmark-bar" id="bookmarkBar">
        <span class="bookmark" data-url="https://httpbin.org/html">📄 httpbin (CORS)</span>
        <span class="bookmark" data-url="https://info.cern.ch">🔬 First website</span>
        <span class="bookmark" data-url="https://www.w3.org">📚 W3C</span>
        <span class="bookmark" data-url="https://example.com">🌐 example.com</span>
    </div>

    <!-- Content area -->
    <div class="content" id="contentArea"></div>

    <!-- Console -->
    <div class="console-panel" id="consolePanel"></div>

    <script>
        (function() {
            // ───── State ─────
            const state = {
                tabs: [],
                activeTabId: null,
                proxyMode: true,    // true = fetch+rewrite, false = direct iframe
                proxyChain: [
                    null,  // direct fetch
                    'https://api.allorigins.win/raw?url=',
                    'https://corsproxy.io/?',
                    'https://thingproxy.freeboard.io/fetch/',
                ],
            };

            const elements = {
                tabBar: document.getElementById('tabBar'),
                contentArea: document.getElementById('contentArea'),
                addressInput: document.getElementById('addressInput'),
                backBtn: document.getElementById('backBtn'),
                forwardBtn: document.getElementById('forwardBtn'),
                refreshBtn: document.getElementById('refreshBtn'),
                goBtn: document.getElementById('goBtn'),
                modeToggle: document.getElementById('modeToggle'),
                modeIcon: document.getElementById('modeIcon'),
                modeLabel: document.getElementById('modeLabel'),
                themeToggle: document.getElementById('themeToggle'),
                consolePanel: document.getElementById('consolePanel'),
                bookmarkBar: document.getElementById('bookmarkBar'),
            };

            // ───── Utility ─────
            function log(msg, type='info') {
                const panel = elements.consolePanel;
                const entry = document.createElement('div');
                entry.className = `console-entry ${type}`;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                panel.appendChild(entry);
                panel.scrollTop = panel.scrollHeight;
            }

            function makeAbsoluteUrls(html, baseUrl) {
                const base = new URL(baseUrl);
                html = html.replace(/<base[^>]*>/gi, '');
                const urlAttrs = ['src','href','action','srcset','data-src','poster','data-href'];
                function absolutify(raw) {
                    if (!raw || /^(data:|blob:|javascript:|mailto:|tel:|#|\/\/)/i.test(raw)) return raw;
                    try { return new URL(raw, base).href; } catch(e) { return raw; }
                }
                html = html.replace(/srcset\s*=\s*"([^"]*)"/gi, (_, v) => {
                    const parts = v.split(',').map(p => {
                        const t = p.trim(), s = t.lastIndexOf(' ');
                        return s>0 ? absolutify(t.substring(0,s))+t.substring(s) : absolutify(t);
                    });
                    return 'srcset="'+parts.join(', ')+'"';
                });
                html = html.replace(/srcset\s*=\s*'([^']*)'/gi, (_, v) => {
                    const parts = v.split(',').map(p => {
                        const t = p.trim(), s = t.lastIndexOf(' ');
                        return s>0 ? absolutify(t.substring(0,s))+t.substring(s) : absolutify(t);
                    });
                    return "srcset='"+parts.join(', ')+"'";
                });
                urlAttrs.forEach(attr => {
                    html = html.replace(new RegExp(attr+'\\s*=\\s*"([^"]*)"','gi'), (m,p1)=> attr+'="'+absolutify(p1)+'"');
                    html = html.replace(new RegExp(attr+"\\s*=\\s*'([^']*)'",'gi'), (m,p1)=> attr+"='"+absolutify(p1)+"'");
                });
                return html;
            }

            // ───── Tab Management ─────
            function createTab(url = 'drake://newtab', title = 'New Tab') {
                const id = Date.now() + Math.random();
                const tab = {
                    id, url, title,
                    history: [url],
                    historyIndex: 0,
                    isLoading: false,
                    error: null,
                    htmlContent: null,
                    mode: state.proxyMode ? 'proxy' : 'iframe',
                };
                state.tabs.push(tab);
                switchTab(id);
                renderTabs();
                if (url && url !== 'drake://newtab') navigateTab(id, url);
                else updateActiveTabContent();
                return tab;
            }

            function closeTab(id) {
                if (state.tabs.length <= 1) return;
                const idx = state.tabs.findIndex(t => t.id === id);
                if (idx === -1) return;
                state.tabs.splice(idx, 1);
                if (state.activeTabId === id) {
                    const newActive = state.tabs[Math.min(idx, state.tabs.length-1)];
                    switchTab(newActive.id);
                }
                renderTabs();
            }

            function switchTab(id) {
                state.activeTabId = id;
                updateActiveTabContent();
                renderTabs();
                const tab = getActiveTab();
                if (tab) {
                    elements.addressInput.value = tab.url;
                    updateNavButtons();
                }
            }

            function getActiveTab() { return state.tabs.find(t=>t.id===state.activeTabId); }

            function renderTabs() {
                elements.tabBar.innerHTML = '';
                state.tabs.forEach(tab => {
                    const el = document.createElement('div');
                    el.className = 'tab' + (tab.id===state.activeTabId?' active':'');
                    el.innerHTML = `<span class="tab-title" title="${escapeHtml(tab.title||tab.url)}">${escapeHtml(tab.title||tab.url)}</span><button class="close-tab" data-close="${tab.id}">&times;</button>`;
                    el.addEventListener('click', (e) => {
                        if (e.target.dataset.close) { e.stopPropagation(); closeTab(tab.id); }
                        else switchTab(tab.id);
                    });
                    elements.tabBar.appendChild(el);
                });
                const newBtn = document.createElement('button');
                newBtn.className = 'new-tab-btn';
                newBtn.textContent = '+';
                newBtn.addEventListener('click', () => createTab());
                elements.tabBar.appendChild(newBtn);
            }

            function escapeHtml(t) {
                const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
                return String(t).replace(/[&<>"']/g, m=>map[m]);
            }

            // ───── Home page content ─────
            function renderHomePage() {
                return `
                <div class="home-page">
                    <h1>Drake Browser</h1>
                    <p style="margin-bottom:0.5rem; color: #888;">Serverless Proxy – No Backend Needed</p>
                    <input type="text" id="homeSearch" placeholder="Enter URL or search…" autofocus>
                    <div class="quick-links">
                        <div class="quick-link" data-url="https://httpbin.org/html">
                            <div class="icon">📄</div><span>CORS Test</span>
                        </div>
                        <div class="quick-link" data-url="https://info.cern.ch">
                            <div class="icon">🔬</div><span>First Website</span>
                        </div>
                        <div class="quick-link" data-url="https://example.com">
                            <div class="icon">🌐</div><span>Example</span>
                        </div>
                        <div class="quick-link" data-url="https://www.w3.org">
                            <div class="icon">📚</div><span>W3C</span>
                        </div>
                    </div>
                </div>`;
            }

            // ───── Content Rendering ─────
            function updateActiveTabContent() {
                const tab = getActiveTab();
                const container = elements.contentArea;
                container.innerHTML = '';
                if (!tab) return;

                // Special internal page
                if (tab.url === 'drake://newtab') {
                    container.innerHTML = renderHomePage();
                    const searchInput = container.querySelector('#homeSearch');
                    if (searchInput) {
                        searchInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                let url = searchInput.value.trim();
                                if (!url) return;
                                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://'+url;
                                navigateTab(tab.id, url);
                            }
                        });
                    }
                    container.querySelectorAll('.quick-link').forEach(el => {
                        el.addEventListener('click', () => {
                            navigateTab(tab.id, el.dataset.url);
                        });
                    });
                    return;
                }

                if (tab.error) {
                    container.innerHTML = `
                    <div class="status-message">
                        <div class="error-details">
                            <h3>⚠️ Failed to load</h3>
                            <p><code>${escapeHtml(tab.url)}</code></p>
                            <p style="margin:12px 0;">${escapeHtml(tab.error)}</p>
                            <button class="retry-btn" onclick="window._retry()">Retry</button>
                        </div>
                    </div>`;
                } else if (tab.mode === 'proxy' && tab.htmlContent) {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'proxy-frame';
                    iframe.srcdoc = tab.htmlContent;
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups';
                    container.appendChild(iframe);
                    iframe.addEventListener('load', () => {
                        try {
                            const doc = iframe.contentDocument || iframe.contentWindow.document;
                            if (doc) {
                                doc.addEventListener('click', (e) => {
                                    const a = e.target.closest('a');
                                    if (a && a.href && !a.href.startsWith('javascript:')) {
                                        e.preventDefault();
                                        navigateTab(tab.id, a.href);
                                    }
                                });
                                doc.addEventListener('submit', (e) => {
                                    const form = e.target;
                                    if (form.method?.toLowerCase()==='get') {
                                        e.preventDefault();
                                        const action = form.action || tab.url;
                                        const fd = new FormData(form);
                                        const params = new URLSearchParams(fd).toString();
                                        navigateTab(tab.id, action+(params?'?'+params:''));
                                    }
                                });
                            }
                        } catch(e) {}
                    });
                } else if (tab.mode === 'iframe') {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'proxy-frame';
                    iframe.src = tab.url;
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation';
                    container.appendChild(iframe);
                } else {
                    container.innerHTML = '<div class="status-message">Loading…</div>';
                }
            }

            // ───── Navigation with fallback chain ─────
            async function tryFetchChain(url) {
                const chain = state.proxyChain;
                for (let i=0; i<chain.length; i++) {
                    const proxy = chain[i];
                    const fetchUrl = proxy ? proxy + encodeURIComponent(url) : url;
                    const mode = proxy ? `proxy #${i}` : 'direct';
                    log(`Trying ${mode}: ${fetchUrl}`, 'info');
                    try {
                        const resp = await fetch(fetchUrl, { mode: 'cors' });
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                        const ct = resp.headers.get('Content-Type') || '';
                        if (!ct.includes('text/html')) throw new Error('Response is not HTML');
                        return resp;
                    } catch(e) {
                        log(`${mode} failed: ${e.message}`, 'error');
                        if (i === chain.length-1) throw new Error('All methods exhausted. The site may block CORS and proxies.');
                    }
                }
            }

            async function navigateTab(tabId, url, addToHistory=true) {
                const tab = state.tabs.find(t=>t.id===tabId);
                if (!tab) return;
                tab.isLoading = true;
                tab.error = null;
                tab.url = url;
                if (addToHistory && url !== tab.url) {
                    tab.history = tab.history.slice(0, tab.historyIndex+1);
                    tab.history.push(url);
                    tab.historyIndex = tab.history.length-1;
                }
                updateNavButtons();
                elements.addressInput.value = url;
                renderTabs();
                updateActiveTabContent();

                if (tab.url === 'drake://newtab') {
                    tab.isLoading = false;
                    updateActiveTabContent();
                    return;
                }

                if (tab.mode === 'proxy') {
                    try {
                        const response = await tryFetchChain(url);
                        const html = await response.text();
                        if (html.length > 5_000_000) throw new Error('Page too large (>5MB)');
                        const finalUrl = response.url;
                        const rewritten = makeAbsoluteUrls(html, finalUrl);
                        tab.htmlContent = rewritten;
                        tab.url = finalUrl;
                        tab.title = finalUrl;
                        tab.error = null;
                        elements.addressInput.value = finalUrl;
                        log(`Successfully loaded: ${finalUrl}`, 'info');
                    } catch(err) {
                        tab.htmlContent = null;
                        tab.error = err.message + (tab.url.includes('youtube.com') ? ' (YouTube is a complex app – try switching to 🖼️ Direct mode)' : '');
                        log(`Error: ${err.message}`, 'error');
                    }
                } else {
                    // Direct iframe mode
                    tab.htmlContent = null;
                    tab.error = null;
                }
                tab.isLoading = false;
                updateActiveTabContent();
                updateNavButtons();
            }

            function goBack() {
                const tab = getActiveTab();
                if (!tab || tab.historyIndex<=0) return;
                tab.historyIndex--;
                navigateTab(tab.id, tab.history[tab.historyIndex], false);
            }
            function goForward() {
                const tab = getActiveTab();
                if (!tab || tab.historyIndex>=tab.history.length-1) return;
                tab.historyIndex++;
                navigateTab(tab.id, tab.history[tab.historyIndex], false);
            }
            function updateNavButtons() {
                const tab = getActiveTab();
                elements.backBtn.disabled = !tab || tab.historyIndex<=0;
                elements.forwardBtn.disabled = !tab || tab.historyIndex>=tab.history.length-1;
            }

            // ───── Event binding ─────
            elements.goBtn.addEventListener('click', () => {
                const tab = getActiveTab();
                if (!tab) return;
                let url = elements.addressInput.value.trim();
                if (!url) return;
                if (!url.startsWith('http://') && !url.startsWith('https://') && url!=='drake://newtab') url = 'https://'+url;
                navigateTab(tab.id, url);
            });
            elements.addressInput.addEventListener('keydown', e => { if(e.key==='Enter') elements.goBtn.click(); });
            elements.backBtn.addEventListener('click', goBack);
            elements.forwardBtn.addEventListener('click', goForward);
            elements.refreshBtn.addEventListener('click', () => {
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, tab.url);
            });

            elements.modeToggle.addEventListener('click', () => {
                const tab = getActiveTab();
                if (!tab) return;
                state.proxyMode = !state.proxyMode;
                tab.mode = state.proxyMode ? 'proxy' : 'iframe';
                elements.modeIcon.textContent = state.proxyMode ? '⚡' : '🖼️';
                elements.modeLabel.textContent = state.proxyMode ? 'Proxy' : 'Direct';
                log(`Switched to ${tab.mode} mode`, 'info');
                if (tab.url !== 'drake://newtab') navigateTab(tab.id, tab.url, false);
            });

            elements.themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light');
                elements.themeToggle.textContent = document.body.classList.contains('light') ? '🌙' : '☀️';
            });

            elements.bookmarkBar.addEventListener('click', e => {
                const bm = e.target.closest('.bookmark');
                if (!bm) return;
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, bm.dataset.url);
            });

            document.addEventListener('keydown', e => {
                if (e.ctrlKey && e.key==='`') {
                    e.preventDefault();
                    elements.consolePanel.classList.toggle('open');
                }
            });

            window._retry = function() {
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, tab.url);
            };

            // ───── Start ─────
            createTab('drake://newtab', 'Home');
            renderTabs();
            log('Drake Browser ready. Press Ctrl+` for console.', 'info');
        })();
    </script>
</body>
</html>
