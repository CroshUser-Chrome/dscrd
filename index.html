<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Discord · Room ID Chat (Stable)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: #202225;
            color: #dcddde;
            height: 100vh;
            overflow: hidden;
        }
        .app { display: flex; height: 100%; width: 100%; }
        .guilds-bar {
            width: 72px;
            background-color: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .guild-icon {
            width: 48px;
            height: 48px;
            background: #2b2d31;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
            color: #dbdee1;
            font-size: 24px;
        }
        .guild-icon.active { border-radius: 16px; background: #5865f2; color: white; }
        .guild-icon:hover { border-radius: 16px; background: #3c3f45; }
        .guild-separator { width: 32px; height: 2px; background: #2b2d31; margin: 8px 0; }
        .channels-bar {
            width: 240px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .channel-header { padding: 16px 16px 8px; font-weight: 600; box-shadow: 0 1px 0 #1e1f22; display: flex; justify-content: space-between; }
        .channel-name { font-size: 16px; color: #f2f3f5; }
        .channel-list { flex: 1; overflow-y: auto; padding: 0 8px; }
        .channel-item { padding: 6px 12px; margin: 2px 0; border-radius: 8px; display: flex; gap: 12px; color: #949ba4; cursor: pointer; }
        .channel-item:hover, .channel-item.active { background: #3c3f45; color: #dbdee1; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #313338; }
        .chat-header {
            padding: 12px 16px;
            background: #2b2d31;
            box-shadow: 0 1px 0 #1e1f22;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chat-title { display: flex; align-items: center; gap: 8px; }
        .connection-status {
            font-size: 12px;
            background: #1e1f22;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .room-panel {
            background: #1e1f22;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .room-panel input {
            background: #111214;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            color: white;
            font-family: monospace;
        }
        .small-btn {
            background: #5865f2;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        .small-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; gap: 16px; align-items: flex-start; }
        .message-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-size: cover;
            background-position: center;
        }
        .message-header { display: flex; align-items: baseline; gap: 8px; }
        .message-username { font-weight: 600; color: #f2f3f5; }
        .message-timestamp { font-size: 10px; color: #6d6f78; }
        .message-text { margin-top: 4px; color: #dbdee1; word-break: break-word; }
        .file-attachment {
            background: #2b2d31;
            border-radius: 8px;
            padding: 8px 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid #3c3f45;
        }
        .input-area { padding: 16px; background: #2b2d31; border-top: 1px solid #1e1f22; }
        .message-input-wrapper {
            background: #383a40;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
        }
        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }
        .attach-btn, .send-btn {
            background: transparent;
            border: none;
            color: #b5bac1;
            cursor: pointer;
            font-size: 20px;
        }
        .members-area {
            width: 240px;
            background: #2b2d31;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .member-header { padding: 16px; font-weight: 600; box-shadow: 0 1px 0 #1e1f22; }
        .member-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; }
        .member-avatar-small { width: 32px; height: 32px; border-radius: 50%; background: #5865f2; background-size: cover; }
        .user-panel {
            background: #232428;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #1e1f22;
            cursor: pointer;
        }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #5865f2; background-size: cover; }
        .user-info { flex: 1; font-size: 14px; font-weight: 500; }
        .user-status { font-size: 11px; color: #a3a6aa; }
        .profile-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #2b2d31;
            width: 360px;
            border-radius: 16px;
            padding: 20px;
        }
        .modal-card input, .modal-card .file-input-label {
            width: 100%;
            background: #1e1f22;
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            margin-bottom: 12px;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; }
        button { background: #5865f2; border: none; padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; }
        .cancel-btn { background: #3c3f45; }
        @media (max-width: 800px) {
            .members-area { display: none; }
            .channels-bar { width: 60px; }
            .channel-item span { display: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="guilds-bar">
        <div class="guild-icon active"><i class="fab fa-discord"></i></div>
        <div class="guild-icon"><i class="fas fa-user-friends"></i></div>
        <div class="guild-separator"></div>
        <div class="guild-icon"><i class="fas fa-plus"></i></div>
    </div>
    <div class="channels-bar">
        <div class="channel-header"><span class="channel-name">P2P CHAT</span><i class="fas fa-hashtag"></i></div>
        <div class="channel-list">
            <div class="channel-item active"><i class="fas fa-hashtag"></i> <span>general</span></div>
            <div class="channel-item"><i class="fas fa-file-alt"></i> <span>files</span></div>
        </div>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-title">
                <i class="fas fa-hashtag"></i> general
                <span class="connection-status" id="connStatus">⚫ Disconnected</span>
            </div>
            <div class="room-panel">
                <span style="font-size:12px;">🔑 Room ID:</span>
                <input type="text" id="roomIdDisplay" readonly style="width:180px; background:#111214;" placeholder="Not created">
                <button id="createRoomBtn" class="small-btn"><i class="fas fa-plus"></i> Create Room</button>
                <input type="text" id="joinRoomId" placeholder="Enter Room ID to join" style="width:180px;">
                <button id="joinRoomBtn" class="small-btn"><i class="fas fa-sign-in-alt"></i> Join</button>
                <button id="disconnectBtn" class="small-btn" style="background:#da373c;">Disconnect</button>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div class="message" style="justify-content:center; opacity:0.7;">
                🎮 Create a room or join one with a Room ID.
            </div>
        </div>
        <div class="input-area">
            <div class="message-input-wrapper">
                <button id="attachFileBtn" class="attach-btn"><i class="fas fa-paperclip"></i></button>
                <input type="text" id="messageInput" class="message-input" placeholder="Message">
                <button id="sendMsgBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
            <input type="file" id="fileInput" style="display:none;">
        </div>
    </div>
    <div class="members-area">
        <div class="member-header">Connected Peer</div>
        <div class="member-list" id="memberList">
            <div class="member-item">
                <div class="member-avatar-small" id="remoteAvatarSmall" style="background:#3c3f45;"><i class="fas fa-user"></i></div>
                <div><strong id="remoteName">Not connected</strong><br><span style="font-size:11px;">offline</span></div>
            </div>
        </div>
    </div>
</div>
<div class="user-panel" id="userProfileBtn">
    <div class="user-avatar" id="currentUserAvatar" style="background:#5865f2;"><i class="fas fa-user" style="display:flex; justify-content:center; align-items:center; height:100%;"></i></div>
    <div class="user-info">
        <div id="currentUsername">Loading...</div>
        <div class="user-status">Click to customize</div>
    </div>
    <i class="fas fa-cog"></i>
</div>
<div id="profileModal" class="profile-modal">
    <div class="modal-card">
        <h3>Customize Profile</h3>
        <label>Username</label>
        <input type="text" id="profileUsername" placeholder="Username">
        <label>Avatar (image)</label>
        <input type="file" id="profileAvatarFile" accept="image/*">
        <div class="modal-buttons">
            <button id="saveProfileBtn">Save</button>
            <button id="closeModalBtn" class="cancel-btn">Cancel</button>
        </div>
    </div>
</div>

<script>
    // ---------- SIMPLE & RELIABLE: PeerJS auto-generates IDs ----------
    let peer = null;
    let currentConnection = null;
    let connected = false;
    let currentRoomId = null;
    let isCreatingRoom = false;
    let isJoiningRoom = false;

    // Profile
    let myProfile = {
        username: "User" + Math.floor(Math.random() * 1000),
        avatarURL: ""
    };
    let remoteProfile = { username: "Unknown", avatarURL: "" };

    let messages = [];

    // DOM elements
    const messagesContainer = document.getElementById("messagesContainer");
    const messageInput = document.getElementById("messageInput");
    const sendMsgBtn = document.getElementById("sendMsgBtn");
    const attachFileBtn = document.getElementById("attachFileBtn");
    const fileInput = document.getElementById("fileInput");
    const connStatusSpan = document.getElementById("connStatus");
    const remoteNameSpan = document.getElementById("remoteName");
    const remoteAvatarSmall = document.getElementById("remoteAvatarSmall");
    const currentUsernameSpan = document.getElementById("currentUsername");
    const currentUserAvatarDiv = document.getElementById("currentUserAvatar");
    const roomIdDisplay = document.getElementById("roomIdDisplay");
    const joinRoomId = document.getElementById("joinRoomId");
    const createRoomBtn = document.getElementById("createRoomBtn");
    const joinRoomBtn = document.getElementById("joinRoomBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");

    const profileModal = document.getElementById("profileModal");
    const profileUsername = document.getElementById("profileUsername");
    const profileAvatarFile = document.getElementById("profileAvatarFile");
    const saveProfileBtn = document.getElementById("saveProfileBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const userProfileBtn = document.getElementById("userProfileBtn");

    // Helper: render messages
    function renderMessages() {
        messagesContainer.innerHTML = "";
        messages.forEach(msg => {
            const isOwn = msg.sender === "me";
            const displayName = isOwn ? myProfile.username : (remoteProfile.username || "Peer");
            let avatarURL = isOwn ? myProfile.avatarURL : remoteProfile.avatarURL;
            const timestamp = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "just now";
            const msgDiv = document.createElement("div");
            msgDiv.className = "message";
            const avatarDiv = document.createElement("div");
            avatarDiv.className = "message-avatar";
            if (avatarURL) {
                avatarDiv.style.backgroundImage = `url('${avatarURL}')`;
                avatarDiv.style.backgroundSize = "cover";
                avatarDiv.innerHTML = "";
            } else {
                avatarDiv.style.background = "#5865f2";
                avatarDiv.innerHTML = displayName.charAt(0).toUpperCase();
            }
            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.innerHTML = `
                <div class="message-header">
                    <span class="message-username">${escapeHtml(displayName)}</span>
                    <span class="message-timestamp">${timestamp}</span>
                </div>
                <div class="message-text">${msg.type === 'text' ? escapeHtml(msg.content) : ''}</div>
            `;
            if (msg.type === 'file') {
                const fileDiv = document.createElement("div");
                fileDiv.className = "file-attachment";
                fileDiv.innerHTML = `<i class="fas fa-file"></i><span>${escapeHtml(msg.fileName)} (${formatBytes(msg.fileSize)})</span><i class="fas fa-download"></i>`;
                fileDiv.onclick = () => {
                    const a = document.createElement('a');
                    a.href = msg.fileDataURL;
                    a.download = msg.fileName;
                    a.click();
                };
                contentDiv.querySelector('.message-text').appendChild(fileDiv);
            }
            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);
            messagesContainer.appendChild(msgDiv);
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMessage(type, content, sender, extra = {}) {
        messages.push({ type, content, sender, timestamp: new Date().toISOString(), ...extra });
        renderMessages();
    }

    function addSystemMessage(text) {
        addMessage('text', text, 'system');
    }

    // Send data via connection
    function sendData(data) {
        if (currentConnection && currentConnection.open) {
            currentConnection.send(JSON.stringify(data));
            return true;
        }
        addSystemMessage("❌ Not connected.");
        return false;
    }

    function sendTextMessage(text) {
        if (!connected) { addSystemMessage("❌ Not connected."); return; }
        const payload = {
            type: "chat",
            subType: "text",
            text: text,
            senderName: myProfile.username,
            senderAvatar: myProfile.avatarURL,
            timestamp: Date.now()
        };
        if (sendData(payload)) addMessage('text', text, 'me');
    }

    function sendFile(file) {
        if (!connected) { addSystemMessage("❌ Not connected."); return; }
        if (file.size > 25 * 1024 * 1024) { addSystemMessage("File too large (max 25MB)"); return; }
        const reader = new FileReader();
        reader.onload = e => {
            const dataURL = e.target.result;
            const payload = {
                type: "chat",
                subType: "file",
                fileName: file.name,
                fileSize: file.size,
                fileDataURL: dataURL,
                senderName: myProfile.username,
                senderAvatar: myProfile.avatarURL,
                timestamp: Date.now()
            };
            if (sendData(payload)) addMessage('file', '', 'me', { fileName: file.name, fileSize: file.size, fileDataURL: dataURL });
        };
        reader.readAsDataURL(file);
    }

    function sendProfileUpdate() {
        if (!connected) return;
        sendData({ type: "profile", username: myProfile.username, avatarURL: myProfile.avatarURL });
    }

    // Set up connection handlers
    function setupConnection(conn) {
        if (currentConnection) {
            conn.close();
            return;
        }
        currentConnection = conn;
        connected = true;
        connStatusSpan.innerHTML = "🟢 Connected";
        addSystemMessage(`✅ Connected to peer (Room: ${currentRoomId})`);
        sendProfileUpdate();

        conn.on('open', () => {
            addSystemMessage("Data channel open.");
        });
        conn.on('data', data => {
            try {
                const msg = JSON.parse(data);
                if (msg.type === "profile") {
                    remoteProfile.username = msg.username;
                    remoteProfile.avatarURL = msg.avatarURL || "";
                    updateRemoteUI();
                    addSystemMessage(`✏️ Peer: ${remoteProfile.username}`);
                    renderMessages();
                } else if (msg.type === "chat") {
                    if (msg.subType === "text") {
                        addMessage('text', msg.text, 'them');
                    } else if (msg.subType === "file") {
                        addMessage('file', '', 'them', { fileName: msg.fileName, fileSize: msg.fileSize, fileDataURL: msg.fileDataURL });
                    }
                }
            } catch(e) { console.warn(e); }
        });
        conn.on('close', () => {
            disconnectFromPeer();
            addSystemMessage("🔌 Peer disconnected.");
        });
        conn.on('error', err => {
            addSystemMessage(`Connection error: ${err.message}`);
            disconnectFromPeer();
        });
    }

    function disconnectFromPeer() {
        if (currentConnection) {
            currentConnection.close();
            currentConnection = null;
        }
        connected = false;
        connStatusSpan.innerHTML = "⚫ Disconnected";
        remoteProfile = { username: "Unknown", avatarURL: "" };
        updateRemoteUI();
        if (peer && currentRoomId) {
            peer.destroy();
            peer = null;
            currentRoomId = null;
            roomIdDisplay.value = "";
            addSystemMessage("Left room. You can create or join another.");
        }
        createRoomBtn.disabled = false;
        joinRoomBtn.disabled = false;
        isCreatingRoom = false;
        isJoiningRoom = false;
    }

    function updateRemoteUI() {
        if (connected && remoteProfile.username !== "Unknown") {
            remoteNameSpan.innerText = remoteProfile.username;
            if (remoteProfile.avatarURL) {
                remoteAvatarSmall.style.backgroundImage = `url('${remoteProfile.avatarURL}')`;
                remoteAvatarSmall.style.backgroundSize = "cover";
                remoteAvatarSmall.innerHTML = "";
            } else {
                remoteAvatarSmall.style.background = "#3c3f45";
                remoteAvatarSmall.innerHTML = '<i class="fas fa-user"></i>';
            }
        } else {
            remoteNameSpan.innerText = "Not connected";
            remoteAvatarSmall.style.background = "#3c3f45";
            remoteAvatarSmall.innerHTML = '<i class="fas fa-user-slash"></i>';
        }
    }

    // Create room: let PeerJS generate a random ID (unique)
    function createRoom() {
        if (currentRoomId) {
            addSystemMessage("Already in a room. Disconnect first.");
            return;
        }
        if (isCreatingRoom) return;
        isCreatingRoom = true;
        createRoomBtn.disabled = true;

        addSystemMessage("Creating room...");
        
        // Destroy existing peer if any
        if (peer) {
            peer.destroy();
            peer = null;
        }
        
        // Create a new peer with auto-generated ID
        peer = new Peer(undefined, { debug: 0 });
        
        peer.on('open', id => {
            currentRoomId = id;
            roomIdDisplay.value = id;
            addSystemMessage(`✅ Room created! ID: ${id}`);
            addSystemMessage("📡 Waiting for someone to join...");
            isCreatingRoom = false;
            createRoomBtn.disabled = false;
        });
        
        peer.on('connection', conn => {
            if (currentConnection) {
                addSystemMessage("Already connected, ignoring new connection.");
                return;
            }
            setupConnection(conn);
        });
        
        peer.on('error', err => {
            console.error(err);
            addSystemMessage(`❌ Failed to create room: ${err.message}`);
            isCreatingRoom = false;
            createRoomBtn.disabled = false;
            if (peer) {
                peer.destroy();
                peer = null;
            }
        });
    }

    // Join room: connect to the given Peer ID
    function joinRoom() {
        const roomId = joinRoomId.value.trim();
        if (!roomId) {
            addSystemMessage("Enter a Room ID to join.");
            return;
        }
        if (currentRoomId) {
            addSystemMessage("Already in a room. Disconnect first.");
            return;
        }
        if (isJoiningRoom) return;
        isJoiningRoom = true;
        joinRoomBtn.disabled = true;
        
        addSystemMessage(`🔗 Joining room ${roomId}...`);
        
        // Destroy existing peer if any
        if (peer) {
            peer.destroy();
            peer = null;
        }
        
        // Create a new peer (joiner gets a random ID)
        peer = new Peer(undefined, { debug: 0 });
        
        let connectionTimeout = setTimeout(() => {
            if (!connected) {
                addSystemMessage("⚠️ Connection timeout. The room might not exist or the creator is offline.");
                disconnectFromPeer();
                isJoiningRoom = false;
                joinRoomBtn.disabled = false;
            }
        }, 15000);
        
        peer.on('open', () => {
            currentRoomId = roomId;
            roomIdDisplay.value = roomId;
            
            const conn = peer.connect(roomId, { reliable: true });
            conn.on('open', () => {
                clearTimeout(connectionTimeout);
                setupConnection(conn);
                isJoiningRoom = false;
                joinRoomBtn.disabled = false;
            });
            conn.on('error', err => {
                clearTimeout(connectionTimeout);
                addSystemMessage(`❌ Could not connect to peer ${roomId}: ${err.message}`);
                disconnectFromPeer();
                isJoiningRoom = false;
                joinRoomBtn.disabled = false;
            });
        });
        
        peer.on('error', err => {
            clearTimeout(connectionTimeout);
            addSystemMessage(`❌ Connection error: ${err.message}`);
            disconnectFromPeer();
            isJoiningRoom = false;
            joinRoomBtn.disabled = false;
        });
    }

    // Profile management
    function loadProfile() {
        const saved = localStorage.getItem("p2p_profile");
        if (saved) {
            try {
                const p = JSON.parse(saved);
                myProfile.username = p.username;
                myProfile.avatarURL = p.avatarURL || "";
            } catch(e) {}
        }
        updateProfileUI();
    }
    function saveProfile() {
        localStorage.setItem("p2p_profile", JSON.stringify({ username: myProfile.username, avatarURL: myProfile.avatarURL }));
    }
    function updateProfileUI() {
        currentUsernameSpan.innerText = myProfile.username;
        if (myProfile.avatarURL) {
            currentUserAvatarDiv.style.backgroundImage = `url('${myProfile.avatarURL}')`;
            currentUserAvatarDiv.style.backgroundSize = "cover";
            currentUserAvatarDiv.innerHTML = "";
        } else {
            currentUserAvatarDiv.style.background = "#5865f2";
            currentUserAvatarDiv.innerHTML = '<i class="fas fa-user" style="display:flex; justify-content:center; align-items:center; height:100%;"></i>';
        }
        renderMessages();
        if (connected) sendProfileUpdate();
    }
    function showProfileModal() {
        profileUsername.value = myProfile.username;
        profileModal.style.display = "flex";
    }
    function closeProfileModal() { profileModal.style.display = "none"; }
    function saveProfileChanges() {
        const newName = profileUsername.value.trim();
        if (newName) myProfile.username = newName;
        const avatarFile = profileAvatarFile.files[0];
        if (avatarFile && avatarFile.type.startsWith("image/")) {
            const reader = new FileReader();
            reader.onload = e => {
                myProfile.avatarURL = e.target.result;
                saveProfile();
                updateProfileUI();
                closeProfileModal();
            };
            reader.readAsDataURL(avatarFile);
        } else {
            saveProfile();
            updateProfileUI();
            closeProfileModal();
        }
    }

    // Helpers
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function formatBytes(b) { if (b===0) return '0 B'; const k=1024, sizes=['B','KB','MB']; const i=Math.floor(Math.log(b)/Math.log(k)); return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+sizes[i]; }

    // Event listeners
    sendMsgBtn.onclick = () => { const t = messageInput.value.trim(); if(t) { sendTextMessage(t); messageInput.value = ""; } };
    messageInput.onkeypress = e => { if(e.key === 'Enter') sendMsgBtn.click(); };
    attachFileBtn.onclick = () => fileInput.click();
    fileInput.onchange = e => { if(e.target.files.length) sendFile(e.target.files[0]); fileInput.value = ""; };
    createRoomBtn.onclick = createRoom;
    joinRoomBtn.onclick = joinRoom;
    disconnectBtn.onclick = disconnectFromPeer;
    userProfileBtn.onclick = showProfileModal;
    saveProfileBtn.onclick = saveProfileChanges;
    closeModalBtn.onclick = closeProfileModal;
    window.onclick = e => { if(e.target === profileModal) closeProfileModal(); };

    // Start
    addSystemMessage("🎤 Ready! Create a room or join one with a Room ID.");
    loadProfile();
</script>
</body>
</html>
