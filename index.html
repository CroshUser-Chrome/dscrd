<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Serverless Browser Proxy</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --danger: #f85149;
            --success: #3fb950;
            --warning: #d2991d;
            --tab-height: 36px;
            --toolbar-height: 44px;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
                sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chrome-like toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            height: var(--toolbar-height);
            padding: 4px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            gap: 6px;
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
        }

        .nav-btn,
        .action-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            font-size: 14px;
        }

        .nav-btn:hover,
        .action-btn:hover {
            background: #222;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .address-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 20px;
            height: 32px;
            padding: 0 12px;
            transition: border-color 0.2s;
        }

        .address-bar:focus-within {
            border-color: var(--accent);
        }

        .address-icon {
            color: #666;
            margin-right: 6px;
            font-size: 12px;
        }

        .address-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 13px;
            width: 100%;
        }

        .go-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 8px;
            height: 28px;
        }

        .go-btn:hover {
            filter: brightness(1.1);
        }

        /* Tab bar */
        .tab-bar {
            display: flex;
            align-items: flex-end;
            background: var(--surface);
            padding: 4px 8px 0;
            gap: 2px;
            overflow-x: auto;
            min-height: 40px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            display: flex;
            align-items: center;
            background: #21262d;
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 6px 12px;
            font-size: 12px;
            color: #8b949e;
            cursor: pointer;
            white-space: nowrap;
            max-width: 200px;
            transition: all 0.15s;
            height: 32px;
            user-select: none;
        }

        .tab.active {
            background: var(--bg);
            color: var(--text);
            border-bottom: 1px solid var(--bg);
            margin-bottom: -1px;
        }

        .tab:hover:not(.active) {
            background: #30363d;
        }

        .tab .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 6px;
        }

        .tab .close-tab {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .tab:hover .close-tab {
            opacity: 1;
        }
        .close-tab:hover {
            background: #444;
            color: #fff;
        }

        .new-tab-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 18px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .new-tab-btn:hover {
            background: #30363d;
            color: #fff;
        }

        /* Content area */
        .content {
            flex: 1;
            position: relative;
            background: #fff;
        }

        iframe.proxy-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Status / error overlay inside a tab (if no iframe shown) */
        .status-message {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            font-size: 14px;
            background: #f8f8f8;
            flex-direction: column;
        }
        .error-details {
            color: var(--danger);
            background: #fff;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            text-align: center;
        }
        .error-details code {
            font-size: 13px;
            background: #f1f1f1;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .retry-btn {
            margin-top: 12px;
            padding: 6px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* CORS proxy toggle */
        .settings-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #8b949e;
            white-space: nowrap;
            margin-left: auto;
        }
        .settings-row input {
            margin: 0;
        }
        .settings-row label {
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .settings-row {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="nav-buttons">
            <button class="nav-btn" id="backBtn" title="Back" disabled>◀</button>
            <button class="nav-btn" id="forwardBtn" title="Forward" disabled>▶</button>
        </div>
        <div class="address-bar">
            <span class="address-icon">🔒</span>
            <input type="text" class="address-input" id="addressInput" placeholder="Enter URL or search…" autofocus>
        </div>
        <button class="go-btn" id="goBtn">Go</button>
        <button class="action-btn" id="refreshBtn" title="Refresh">↻</button>
        <div class="settings-row">
            <input type="checkbox" id="corsProxyToggle">
            <label for="corsProxyToggle">Use CORS proxy</label>
            <span title="When direct fetch fails (CORS blocked), the page will be loaded through a public proxy">ℹ️</span>
        </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar" id="tabBar"></div>

    <!-- Content area -->
    <div class="content" id="contentArea"></div>

    <script>
        (function() {
            // ---- Simple tab manager ----
            const state = {
                tabs: [],              // { id, url, title, history (array of URLs), historyIndex }
                activeTabId: null,
                corsProxyEnabled: false,
                corsProxyUrl: 'https://api.allorigins.win/raw?url=', // public proxy
            };

            const elements = {
                tabBar: document.getElementById('tabBar'),
                contentArea: document.getElementById('contentArea'),
                addressInput: document.getElementById('addressInput'),
                backBtn: document.getElementById('backBtn'),
                forwardBtn: document.getElementById('forwardBtn'),
                refreshBtn: document.getElementById('refreshBtn'),
                goBtn: document.getElementById('goBtn'),
                corsToggle: document.getElementById('corsProxyToggle'),
            };

            // ---- Utilities ----
            function makeAbsoluteUrls(html, baseUrl) {
                const base = new URL(baseUrl);
                // remove existing <base> tag to avoid double rewriting
                html = html.replace(/<base[^>]*>/gi, '');
                // insert our own base just in case
                // but we'll do manual rewriting instead
                const urlAttrs = ['src', 'href', 'action', 'srcset', 'data-src', 'poster', 'data-href'];

                function absolutify(raw) {
                    if (!raw || /^(data:|blob:|javascript:|mailto:|tel:|#|\/\/)/i.test(raw)) return raw;
                    try {
                        return new URL(raw, base).href;
                    } catch (e) {
                        return raw;
                    }
                }

                // srcset
                html = html.replace(/srcset\s*=\s*"([^"]*)"/gi, (match, value) => {
                    const parts = value.split(',').map(p => {
                        const trimmed = p.trim();
                        const lastSpace = trimmed.lastIndexOf(' ');
                        if (lastSpace > 0) {
                            return absolutify(trimmed.substring(0, lastSpace)) + trimmed.substring(lastSpace);
                        }
                        return absolutify(trimmed);
                    });
                    return 'srcset="' + parts.join(', ') + '"';
                });
                html = html.replace(/srcset\s*=\s*'([^']*)'/gi, (match, value) => {
                    const parts = value.split(',').map(p => {
                        const trimmed = p.trim();
                        const lastSpace = trimmed.lastIndexOf(' ');
                        if (lastSpace > 0) {
                            return absolutify(trimmed.substring(0, lastSpace)) + trimmed.substring(lastSpace);
                        }
                        return absolutify(trimmed);
                    });
                    return "srcset='" + parts.join(', ') + "'";
                });

                urlAttrs.forEach(attr => {
                    const regexDouble = new RegExp(attr + '\\s*=\\s*"([^"]*)"', 'gi');
                    html = html.replace(regexDouble, (m, p1) => attr + '="' + absolutify(p1) + '"');
                    const regexSingle = new RegExp(attr + "\\s*=\\s*'([^']*)'", 'gi');
                    html = html.replace(regexSingle, (m, p1) => attr + "='" + absolutify(p1) + "'");
                });
                return html;
            }

            // ---- Tab operations ----
            function createTab(url = 'about:blank', title = 'New Tab') {
                const id = Date.now() + Math.random();
                const tab = {
                    id,
                    url,
                    title,
                    history: [url],
                    historyIndex: 0,
                    isLoading: false,
                    error: null,
                    htmlContent: null, // stored HTML for srcdoc
                };
                state.tabs.push(tab);
                switchTab(id);
                renderTabs();
                if (url && url !== 'about:blank') {
                    navigateTab(id, url);
                } else {
                    updateActiveTabContent();
                }
                return tab;
            }

            function closeTab(id) {
                if (state.tabs.length <= 1) return; // keep at least one tab
                const index = state.tabs.findIndex(t => t.id === id);
                if (index === -1) return;
                state.tabs.splice(index, 1);
                if (state.activeTabId === id) {
                    const newActive = state.tabs[Math.min(index, state.tabs.length - 1)];
                    switchTab(newActive.id);
                }
                renderTabs();
            }

            function switchTab(id) {
                state.activeTabId = id;
                updateActiveTabContent();
                renderTabs();
                const tab = getActiveTab();
                if (tab) {
                    elements.addressInput.value = tab.url;
                    updateNavButtons();
                }
            }

            function getActiveTab() {
                return state.tabs.find(t => t.id === state.activeTabId);
            }

            function renderTabs() {
                elements.tabBar.innerHTML = '';
                state.tabs.forEach(tab => {
                    const el = document.createElement('div');
                    el.className = 'tab' + (tab.id === state.activeTabId ? ' active' : '');
                    el.innerHTML = `
                        <span class="tab-title" title="${escapeHtml(tab.title || tab.url)}">${escapeHtml(tab.title || tab.url)}</span>
                        <button class="close-tab" data-close="${tab.id}">&times;</button>
                    `;
                    el.addEventListener('click', (e) => {
                        if (e.target.dataset.close) {
                            e.stopPropagation();
                            closeTab(tab.id);
                        } else {
                            switchTab(tab.id);
                        }
                    });
                    elements.tabBar.appendChild(el);
                });
                // new tab button
                const newBtn = document.createElement('button');
                newBtn.className = 'new-tab-btn';
                newBtn.textContent = '+';
                newBtn.addEventListener('click', () => createTab());
                elements.tabBar.appendChild(newBtn);
            }

            function updateActiveTabContent() {
                const tab = getActiveTab();
                const container = elements.contentArea;
                container.innerHTML = '';
                if (!tab) return;

                if (tab.error) {
                    // show error page
                    const div = document.createElement('div');
                    div.className = 'status-message';
                    div.innerHTML = `
                        <div class="error-details">
                            <h3 style="margin-bottom:8px;">⚠️ Failed to load page</h3>
                            <p style="color:#333;"><code>${escapeHtml(tab.url)}</code></p>
                            <p style="margin:12px 0;">${escapeHtml(tab.error)}</p>
                            <button class="retry-btn" onclick="window._retry()">Retry</button>
                        </div>
                    `;
                    container.appendChild(div);
                } else if (tab.htmlContent) {
                    // create iframe with srcdoc
                    const iframe = document.createElement('iframe');
                    iframe.className = 'proxy-frame';
                    iframe.srcdoc = tab.htmlContent;
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups';
                    container.appendChild(iframe);

                    // Intercept link clicks to keep browsing inside the proxy
                    iframe.addEventListener('load', () => {
                        try {
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            if (iframeDoc) {
                                iframeDoc.addEventListener('click', (e) => {
                                    const link = e.target.closest('a');
                                    if (link && link.href && !link.href.startsWith('javascript:')) {
                                        e.preventDefault();
                                        const newUrl = link.href;
                                        navigateTab(tab.id, newUrl);
                                    }
                                });
                                // Also catch form submissions (simple post)
                                iframeDoc.addEventListener('submit', (e) => {
                                    const form = e.target;
                                    if (form.method && form.method.toLowerCase() === 'get') {
                                        e.preventDefault();
                                        const action = form.action || tab.url;
                                        const formData = new FormData(form);
                                        const params = new URLSearchParams(formData).toString();
                                        const newUrl = action + (params ? '?' + params : '');
                                        navigateTab(tab.id, newUrl);
                                    }
                                    // for POST we can't easily proxy without server, just let it go
                                });
                            }
                        } catch (err) {
                            // if same-origin lost (unlikely), ignore
                        }
                    });
                } else {
                    // blank or loading
                    const div = document.createElement('div');
                    div.className = 'status-message';
                    div.textContent = tab.url === 'about:blank' ? 'New Tab' : 'Loading...';
                    container.appendChild(div);
                }
            }

            function escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return String(text).replace(/[&<>"']/g, m => map[m]);
            }

            // ---- Navigation ----
            async function navigateTab(tabId, url, addToHistory = true) {
                const tab = state.tabs.find(t => t.id === tabId);
                if (!tab) return;
                tab.isLoading = true;
                tab.error = null;
                tab.url = url;
                if (addToHistory) {
                    // trim forward history
                    tab.history = tab.history.slice(0, tab.historyIndex + 1);
                    tab.history.push(url);
                    tab.historyIndex = tab.history.length - 1;
                }
                updateNavButtons();
                elements.addressInput.value = url;
                renderTabs();
                updateActiveTabContent(); // show loading

                try {
                    let fetchUrl = url;
                    if (state.corsProxyEnabled && !url.startsWith('about:')) {
                        fetchUrl = state.corsProxyUrl + encodeURIComponent(url);
                    }
                    const response = await fetch(fetchUrl, { mode: 'cors' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    const contentType = response.headers.get('Content-Type') || '';
                    if (!contentType.includes('text/html') && !contentType.includes('text/plain'))
                        throw new Error('Not an HTML page (Content-Type: ' + contentType + ')');
                    const html = await response.text();
                    const finalUrl = response.url; // after redirects
                    const rewritten = makeAbsoluteUrls(html, finalUrl);
                    tab.htmlContent = rewritten;
                    tab.url = finalUrl; // update to final URL
                    tab.title = finalUrl; // could extract <title> later
                    tab.error = null;
                    elements.addressInput.value = finalUrl;
                } catch (err) {
                    console.error(err);
                    tab.htmlContent = null;
                    let msg = err.message;
                    if (err instanceof TypeError && msg.includes('Failed to fetch')) {
                        msg = 'Network error or CORS blocked. Try enabling the CORS proxy toggle in the top bar.';
                    } else if (msg.includes('HTTP 403')) {
                        msg = 'Access denied (403 Forbidden).';
                    } else if (msg.includes('HTTP 404')) {
                        msg = 'Page not found (404).';
                    }
                    tab.error = msg;
                }
                tab.isLoading = false;
                renderTabs();
                updateActiveTabContent();
                updateNavButtons();
            }

            function goBack() {
                const tab = getActiveTab();
                if (!tab || tab.historyIndex <= 0) return;
                tab.historyIndex--;
                const prevUrl = tab.history[tab.historyIndex];
                navigateTab(tab.id, prevUrl, false);
            }

            function goForward() {
                const tab = getActiveTab();
                if (!tab || tab.historyIndex >= tab.history.length - 1) return;
                tab.historyIndex++;
                const nextUrl = tab.history[tab.historyIndex];
                navigateTab(tab.id, nextUrl, false);
            }

            function updateNavButtons() {
                const tab = getActiveTab();
                elements.backBtn.disabled = !tab || tab.historyIndex <= 0;
                elements.forwardBtn.disabled = !tab || tab.historyIndex >= tab.history.length - 1;
            }

            // ---- Event listeners ----
            elements.goBtn.addEventListener('click', () => {
                const tab = getActiveTab();
                if (!tab) return;
                let url = elements.addressInput.value.trim();
                if (!url) return;
                if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('about:')) {
                    url = 'https://' + url;
                    elements.addressInput.value = url;
                }
                navigateTab(tab.id, url);
            });

            elements.addressInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') elements.goBtn.click();
            });

            elements.backBtn.addEventListener('click', goBack);
            elements.forwardBtn.addEventListener('click', goForward);
            elements.refreshBtn.addEventListener('click', () => {
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, tab.url);
            });

            elements.corsToggle.addEventListener('change', (e) => {
                state.corsProxyEnabled = e.target.checked;
            });

            // expose retry
            window._retry = function() {
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, tab.url);
            };

            // ---- Init ----
            createTab('about:blank', 'New Tab');
            renderTabs();
        })();
    </script>
</body>
</html>
