<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drake Browser – Serverless Proxy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #7289da;
            --danger: #f04747;
            --success: #43b581;
            --tab-height: 36px;
            --toolbar-height: 44px;
        }
        .light {
            --bg: #ffffff;
            --surface: #f2f3f5;
            --border: #d0d0d5;
            --text: #1e1e2e;
            --accent: #5865f2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.2s;
        }
        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            height: var(--toolbar-height);
            padding: 4px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            gap: 6px;
            flex-shrink: 0;
            z-index: 3;
        }
        .nav-btn, .action-btn {
            width: 28px; height: 28px;
            border-radius: 6px; border: none;
            background: transparent; color: var(--text);
            font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover, .action-btn:hover { background: rgba(128,128,128,0.2); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; }
        .address-bar {
            flex: 1; display: flex; align-items: center;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 20px; height: 32px; padding: 0 12px;
        }
        .address-bar:focus-within { border-color: var(--accent); }
        .address-input {
            background: transparent; border: none; outline: none;
            color: var(--text); font-size: 13px; width: 100%;
        }
        .go-btn {
            background: var(--accent); color: #fff; border: none;
            border-radius: 16px; padding: 4px 16px; font-size: 13px;
            font-weight: 600; cursor: pointer; height: 28px;
        }
        .mode-btn {
            font-size: 12px; padding: 2px 12px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); cursor: pointer; white-space: nowrap;
        }
        .theme-toggle { margin-left: 4px; cursor: pointer; font-size: 18px; }

        /* Tab bar */
        .tab-bar {
            display: flex; align-items: flex-end;
            background: var(--surface); padding: 4px 8px 0; gap: 2px;
            overflow-x: auto; min-height: 40px; flex-shrink: 0;
            border-bottom: 1px solid var(--border); z-index: 2;
        }
        .tab {
            display: flex; align-items: center;
            background: #21262d; border: 1px solid var(--border);
            border-bottom: none; border-radius: 8px 8px 0 0;
            padding: 6px 12px; font-size: 12px; color: #8b949e;
            cursor: pointer; white-space: nowrap; max-width: 200px;
            transition: all 0.15s; height: 32px; user-select: none;
        }
        .light .tab { background: #e0e0e8; color: #555; }
        .tab.active {
            background: var(--bg); color: var(--text);
            border-bottom: 1px solid var(--bg); margin-bottom: -1px;
        }
        .tab:hover:not(.active) { background: #30363d; }
        .tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 6px; }
        .close-tab {
            width: 16px; height: 16px; border-radius: 50%;
            border: none; background: transparent; color: #8b949e;
            cursor: pointer; font-size: 14px; display: flex;
            align-items: center; justify-content: center; opacity: 0;
        }
        .tab:hover .close-tab { opacity: 1; }
        .close-tab:hover { background: #444; color: #fff; }
        .new-tab-btn {
            background: transparent; border: none; color: #8b949e;
            font-size: 18px; cursor: pointer; width: 28px; height: 28px;
            border-radius: 6px; display: flex; align-items: center;
            justify-content: center; margin-bottom: 4px;
        }
        .new-tab-btn:hover { background: #30363d; color: #fff; }

        /* Bookmark bar */
        .bookmark-bar {
            display: flex; background: var(--surface);
            border-bottom: 1px solid var(--border); padding: 4px 12px;
            gap: 12px; overflow-x: auto; font-size: 12px; flex-shrink: 0;
        }
        .bookmark { color: var(--accent); cursor: pointer; text-decoration: none; }
        .bookmark:hover { text-decoration: underline; }

        /* Content area - FULL HEIGHT */
        .content {
            flex: 1; position: relative; background: #fff; overflow: hidden;
        }
        iframe.proxy-frame {
            width: 100%; height: 100%; border: none; display: block;
        }
        .status-message {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--text); font-size: 14px;
            background: var(--bg); flex-direction: column; padding: 2rem;
        }
        .error-details {
            background: var(--surface); padding: 24px; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2); max-width: 480px; text-align: center;
        }
        .retry-btn {
            margin-top: 12px; padding: 6px 20px; background: var(--accent);
            color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
        }

        /* Home page */
        .home-page {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; background: var(--bg);
            text-align: center; padding: 2rem;
        }
        .home-page h1 {
            font-size: 3rem; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), #9b59b6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .home-page input {
            width: 100%; max-width: 500px; padding: 0.8rem 1.2rem;
            border: 2px solid var(--border); border-radius: 24px;
            background: var(--surface); color: var(--text);
            font-size: 16px; margin: 1rem 0; outline: none;
        }
        .home-page input:focus { border-color: var(--accent); }
        .quick-links { display: flex; gap: 1.5rem; margin-top: 2rem; }
        .quick-link {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; color: var(--text); text-decoration: none;
        }
        .quick-link .icon {
            width: 48px; height: 48px; border-radius: 12px;
            background: var(--surface); display: flex; align-items: center;
            justify-content: center; font-size: 24px; margin-bottom: 6px;
        }

        /* Console */
        .console-panel {
            display: none; background: #1e1e2e; color: #cdd6f4;
            font-family: monospace; font-size: 12px; padding: 8px;
            max-height: 120px; overflow-y: auto; border-top: 1px solid var(--border);
        }
        .console-panel.open { display: block; }
        .console-entry { margin: 2px 0; }
        .console-entry.error { color: var(--danger); }
        .console-entry.info { color: var(--accent); }
        .console-entry.warn { color: #faa61a; }
    </style>
</head>
<body class="light">
    <div class="toolbar">
        <div class="nav-buttons">
            <button class="nav-btn" id="backBtn" disabled>◀</button>
            <button class="nav-btn" id="forwardBtn" disabled>▶</button>
        </div>
        <div class="address-bar">
            <span style="color:#888;">🔒</span>
            <input type="text" class="address-input" id="addressInput" placeholder="Search or enter URL…" autofocus>
        </div>
        <button class="go-btn" id="goBtn">Go</button>
        <button class="action-btn" id="refreshBtn" title="Refresh">↻</button>
        <button class="mode-btn" id="modeToggle">
            <span id="modeIcon">⚡</span> <span id="modeLabel">Proxy</span>
        </button>
        <span class="theme-toggle" id="themeToggle">🌙</span>
    </div>
    <div class="tab-bar" id="tabBar"></div>
    <div class="bookmark-bar" id="bookmarkBar">
        <span class="bookmark" data-url="https://httpbin.org/html">📄 httpbin</span>
        <span class="bookmark" data-url="https://info.cern.ch">🔬 First website</span>
        <span class="bookmark" data-url="https://example.com">🌐 example</span>
    </div>
    <div class="content" id="contentArea"></div>
    <div class="console-panel" id="consolePanel"></div>

    <script>
        (() => {
            // ---- State ----
            const state = {
                tabs: [],
                activeTabId: null,
                proxyMode: true,          // true = proxy, false = direct iframe
                proxyLatency: {},         // stored proxy speed rankings
                pageCache: new Map(),     // in-memory cache for instant back/forward
            };

            // ---- Proxy Engine ----
            const ProxyEngine = {
                // Sorted list of proxies (direct fetch comes first)
                getProxies() {
                    const stored = localStorage.getItem('proxyRanking');
                    if (stored) {
                        try {
                            return JSON.parse(stored);
                        } catch(e) {}
                    }
                    // Default chain: direct, then fast public proxies
                    return [
                        { name: 'direct', fn: (url) => fetch(url, {mode:'cors'}) },
                        { name: 'allorigins', fn: (url) => fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`) },
                        { name: 'corsproxy.io', fn: (url) => fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`) },
                        { name: 'thingproxy', fn: (url) => fetch(`https://thingproxy.freeboard.io/fetch/${encodeURIComponent(url)}`) },
                        { name: 'googlecache', fn: (url) => fetch(`https://webcache.googleusercontent.com/search?q=cache:${encodeURIComponent(url)}`) },
                        { name: 'wayback', fn: (url) => fetch(`https://web.archive.org/web/20240101000000if_/${encodeURIComponent(url)}`) },
                    ];
                },

                // Race all proxies, return first valid HTML response
                async fetchWithRace(url) {
                    const proxies = this.getProxies();
                    const fetchPromises = proxies.map(async (proxy) => {
                        const start = Date.now();
                        try {
                            const resp = await proxy.fn(url);
                            if (!resp.ok) throw new Error(`Status ${resp.status}`);
                            const ct = resp.headers.get('Content-Type') || '';
                            if (!ct.includes('text/html')) throw new Error('Not HTML');
                            const html = await resp.text();
                            const latency = Date.now() - start;
                            this.reportLatency(proxy.name, latency);
                            return { html, finalUrl: resp.url, proxy: proxy.name, latency };
                        } catch(err) {
                            this.reportLatency(proxy.name, 99999);  // mark as slow
                            throw err;
                        }
                    });
                    // Use Promise.any (first success wins)
                    const winner = await Promise.any(fetchPromises);
                    log(`🏆 Fastest proxy: ${winner.proxy} (${winner.latency}ms)`, 'info');
                    return winner;
                },

                reportLatency(proxyName, latency) {
                    state.proxyLatency[proxyName] = latency;
                    // Persist ranking sorted by latency
                    const ranking = Object.entries(state.proxyLatency)
                        .filter(([name]) => name !== 'direct') // direct always first
                        .sort((a,b) => a[1] - b[1])
                        .map(([name]) => name);
                    localStorage.setItem('proxyRanking', JSON.stringify([
                        'direct',
                        ...ranking.filter(n => n !== 'direct')
                    ]));
                },

                // Benchmark all proxies in background, update rankings
                async benchmark() {
                    const testUrl = 'https://httpbin.org/html';
                    log('⚡ Benchmarking proxies...', 'info');
                    const proxies = this.getProxies();
                    for (const proxy of proxies) {
                        try {
                            const start = Date.now();
                            const resp = await proxy.fn(testUrl);
                            await resp.text();
                            this.reportLatency(proxy.name, Date.now() - start);
                        } catch(e) {
                            this.reportLatency(proxy.name, 99999);
                        }
                    }
                    log('✅ Benchmark complete. Rankings updated.', 'info');
                }
            };

            // ---- DOM elements ----
            const elements = {
                tabBar: document.getElementById('tabBar'),
                contentArea: document.getElementById('contentArea'),
                addressInput: document.getElementById('addressInput'),
                backBtn: document.getElementById('backBtn'),
                forwardBtn: document.getElementById('forwardBtn'),
                refreshBtn: document.getElementById('refreshBtn'),
                goBtn: document.getElementById('goBtn'),
                modeToggle: document.getElementById('modeToggle'),
                modeIcon: document.getElementById('modeIcon'),
                modeLabel: document.getElementById('modeLabel'),
                themeToggle: document.getElementById('themeToggle'),
                consolePanel: document.getElementById('consolePanel'),
                bookmarkBar: document.getElementById('bookmarkBar'),
            };

            function log(msg, type='info') {
                const panel = elements.consolePanel;
                const entry = document.createElement('div');
                entry.className = `console-entry ${type}`;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                panel.appendChild(entry);
                panel.scrollTop = panel.scrollHeight;
            }

            // ---- URL rewriting ----
            function makeAbsoluteUrls(html, baseUrl) {
                const base = new URL(baseUrl);
                html = html.replace(/<base[^>]*>/gi, '');
                const urlAttrs = ['src','href','action','srcset','data-src','poster','data-href'];
                function absolutify(raw) {
                    if (!raw || /^(data:|blob:|javascript:|mailto:|tel:|#|\/\/)/i.test(raw)) return raw;
                    try { return new URL(raw, base).href; } catch(e) { return raw; }
                }
                html = html.replace(/srcset\s*=\s*"([^"]*)"/gi, (_, v) => {
                    const parts = v.split(',').map(p => {
                        const t = p.trim(), s = t.lastIndexOf(' ');
                        return s>0 ? absolutify(t.substring(0,s))+t.substring(s) : absolutify(t);
                    });
                    return 'srcset="'+parts.join(', ')+'"';
                });
                html = html.replace(/srcset\s*=\s*'([^']*)'/gi, (_, v) => {
                    const parts = v.split(',').map(p => {
                        const t = p.trim(), s = t.lastIndexOf(' ');
                        return s>0 ? absolutify(t.substring(0,s))+t.substring(s) : absolutify(t);
                    });
                    return "srcset='"+parts.join(', ')+"'";
                });
                urlAttrs.forEach(attr => {
                    html = html.replace(new RegExp(attr+'\\s*=\\s*"([^"]*)"','gi'), (m,p1)=> attr+'="'+absolutify(p1)+'"');
                    html = html.replace(new RegExp(attr+"\\s*=\\s*'([^']*)'",'gi'), (m,p1)=> attr+"='"+absolutify(p1)+"'");
                });
                return html;
            }

            // ---- Tab Management ----
            function createTab(url = 'drake://newtab', title = 'Home') {
                const id = Date.now() + Math.random();
                const tab = {
                    id, url, title,
                    history: [url],
                    historyIndex: 0,
                    isLoading: false,
                    error: null,
                    htmlContent: null,   // for proxy mode
                    mode: state.proxyMode ? 'proxy' : 'iframe',
                };
                state.tabs.push(tab);
                switchTab(id);
                renderTabs();
                if (url !== 'drake://newtab') navigateTab(id, url);
                else updateActiveTabContent();
                return tab;
            }

            function closeTab(id) {
                if (state.tabs.length <= 1) return;
                const idx = state.tabs.findIndex(t => t.id === id);
                if (idx === -1) return;
                state.tabs.splice(idx, 1);
                if (state.activeTabId === id) {
                    const newActive = state.tabs[Math.min(idx, state.tabs.length-1)];
                    switchTab(newActive.id);
                }
                renderTabs();
            }

            function switchTab(id) {
                state.activeTabId = id;
                updateActiveTabContent();
                renderTabs();
                const tab = getActiveTab();
                if (tab) {
                    elements.addressInput.value = tab.url;
                    updateNavButtons();
                }
            }

            function getActiveTab() { return state.tabs.find(t => t.id === state.activeTabId); }

            function renderTabs() {
                elements.tabBar.innerHTML = '';
                state.tabs.forEach(tab => {
                    const el = document.createElement('div');
                    el.className = 'tab' + (tab.id === state.activeTabId ? ' active' : '');
                    el.innerHTML = `<span class="tab-title" title="${escapeHtml(tab.title||tab.url)}">${escapeHtml(tab.title||tab.url)}</span><button class="close-tab" data-close="${tab.id}">&times;</button>`;
                    el.addEventListener('click', (e) => {
                        if (e.target.dataset.close) { e.stopPropagation(); closeTab(tab.id); }
                        else switchTab(tab.id);
                    });
                    elements.tabBar.appendChild(el);
                });
                const newBtn = document.createElement('button');
                newBtn.className = 'new-tab-btn';
                newBtn.textContent = '+';
                newBtn.addEventListener('click', () => createTab());
                elements.tabBar.appendChild(newBtn);
            }

            function escapeHtml(t) {
                const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
                return String(t).replace(/[&<>"']/g, m => map[m]);
            }

            // Home page
            function renderHomePage(tabId) {
                return `
                <div class="home-page">
                    <h1>Drake Browser</h1>
                    <p style="margin-bottom:0.5rem;color:#888;">⚡ Multi‑proxy + cache · No server needed</p>
                    <input type="text" id="homeSearch" placeholder="Enter URL…" autofocus>
                    <div class="quick-links">
                        <div class="quick-link" data-url="https://httpbin.org/html"><div class="icon">📄</div><span>CORS Test</span></div>
                        <div class="quick-link" data-url="https://info.cern.ch"><div class="icon">🔬</div><span>First site</span></div>
                        <div class="quick-link" data-url="https://example.com"><div class="icon">🌐</div><span>Example</span></div>
                        <div class="quick-link" data-url="https://www.w3.org"><div class="icon">📚</div><span>W3C</span></div>
                    </div>
                    <button style="margin-top:2rem;padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;" 
                            onclick="window._benchmark()">⚡ Benchmark Proxies</button>
                </div>`;
            }

            function updateActiveTabContent() {
                const tab = getActiveTab();
                const container = elements.contentArea;
                container.innerHTML = '';

                if (!tab) return;
                if (tab.url === 'drake://newtab') {
                    container.innerHTML = renderHomePage(tab.id);
                    const search = container.querySelector('#homeSearch');
                    if (search) {
                        search.addEventListener('keydown', e => {
                            if (e.key === 'Enter') {
                                let url = search.value.trim();
                                if (!url) return;
                                if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://'+url;
                                navigateTab(tab.id, url);
                            }
                        });
                    }
                    container.querySelectorAll('.quick-link').forEach(el => {
                        el.addEventListener('click', () => navigateTab(tab.id, el.dataset.url));
                    });
                    return;
                }

                if (tab.error) {
                    container.innerHTML = `
                    <div class="status-message">
                        <div class="error-details">
                            <h3>⚠️ Failed to load</h3>
                            <p><code>${escapeHtml(tab.url)}</code></p>
                            <p style="margin:12px 0;">${escapeHtml(tab.error)}</p>
                            <button class="retry-btn" onclick="window._retry()">Retry</button>
                        </div>
                    </div>`;
                } else if (tab.mode === 'proxy' && tab.htmlContent) {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'proxy-frame';
                    iframe.srcdoc = tab.htmlContent;
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups';
                    container.appendChild(iframe);
                    // intercept clicks inside iframe
                    iframe.addEventListener('load', () => {
                        try {
                            const doc = iframe.contentDocument || iframe.contentWindow.document;
                            if (doc) {
                                doc.addEventListener('click', (e) => {
                                    const a = e.target.closest('a');
                                    if (a && a.href && !a.href.startsWith('javascript:')) {
                                        e.preventDefault();
                                        navigateTab(tab.id, a.href);
                                    }
                                });
                                doc.addEventListener('submit', (e) => {
                                    const form = e.target;
                                    if (form.method?.toLowerCase()==='get') {
                                        e.preventDefault();
                                        const action = form.action || tab.url;
                                        const fd = new FormData(form);
                                        const params = new URLSearchParams(fd).toString();
                                        navigateTab(tab.id, action+(params?'?'+params:''));
                                    }
                                });
                            }
                        } catch(e) {}
                    });
                } else if (tab.mode === 'iframe') {
                    const iframe = document.createElement('iframe');
                    iframe.className = 'proxy-frame';
                    iframe.src = tab.url;
                    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation';
                    container.appendChild(iframe);
                } else {
                    container.innerHTML = '<div class="status-message">Loading…</div>';
                }
            }

            // ---- Navigation with caching & racing ----
            async function navigateTab(tabId, url, addToHistory=true) {
                const tab = state.tabs.find(t => t.id === tabId);
                if (!tab) return;
                tab.isLoading = true;
                tab.error = null;
                tab.url = url;
                if (addToHistory && url !== tab.url) {
                    tab.history = tab.history.slice(0, tab.historyIndex+1);
                    tab.history.push(url);
                    tab.historyIndex = tab.history.length-1;
                }
                updateNavButtons();
                elements.addressInput.value = url;
                renderTabs();
                updateActiveTabContent();

                if (url === 'drake://newtab') {
                    tab.isLoading = false;
                    updateActiveTabContent();
                    return;
                }

                // Check cache first (instant back/forward)
                const cached = state.pageCache.get(url);
                if (cached && tab.mode === 'proxy') {
                    log(`💨 Cache hit: ${url}`, 'info');
                    tab.htmlContent = cached.html;
                    tab.url = cached.finalUrl;
                    tab.title = cached.finalUrl;
                    tab.error = null;
                    tab.isLoading = false;
                    updateActiveTabContent();
                    updateNavButtons();
                    return;
                }

                if (tab.mode === 'proxy') {
                    try {
                        log(`🌐 Loading via proxy race: ${url}`, 'info');
                        const result = await ProxyEngine.fetchWithRace(url);
                        const rewritten = makeAbsoluteUrls(result.html, result.finalUrl);
                        tab.htmlContent = rewritten;
                        tab.url = result.finalUrl;
                        tab.title = result.finalUrl;
                        tab.error = null;
                        elements.addressInput.value = result.finalUrl;
                        // Cache result (up to 50 entries, LRU)
                        if (state.pageCache.size > 50) {
                            const firstKey = state.pageCache.keys().next().value;
                            state.pageCache.delete(firstKey);
                        }
                        state.pageCache.set(url, { html: rewritten, finalUrl: result.finalUrl });
                        log(`✅ Page cached for instant revisit.`, 'info');
                    } catch(err) {
                        tab.htmlContent = null;
                        tab.error = `All proxies failed. Try enabling Direct mode or refreshing. (${err.message})`;
                        log(`❌ ${tab.error}`, 'error');
                    }
                } else {
                    tab.htmlContent = null;
                    tab.error = null;
                }
                tab.isLoading = false;
                updateActiveTabContent();
                updateNavButtons();
            }

            function goBack() {
                const tab = getActiveTab();
                if (!tab || tab.historyIndex <= 0) return;
                tab.historyIndex--;
                navigateTab(tab.id, tab.history[tab.historyIndex], false);
            }
            function goForward() {
                const tab = getActiveTab();
                if (!tab || tab.historyIndex >= tab.history.length-1) return;
                tab.historyIndex++;
                navigateTab(tab.id, tab.history[tab.historyIndex], false);
            }
            function updateNavButtons() {
                const tab = getActiveTab();
                elements.backBtn.disabled = !tab || tab.historyIndex <= 0;
                elements.forwardBtn.disabled = !tab || tab.historyIndex >= tab.history.length-1;
            }

            // ---- Events ----
            elements.goBtn.addEventListener('click', () => {
                const tab = getActiveTab();
                if (!tab) return;
                let url = elements.addressInput.value.trim();
                if (!url) return;
                if (!url.startsWith('http://') && !url.startsWith('https://') && url !== 'drake://newtab') url = 'https://'+url;
                navigateTab(tab.id, url);
            });
            elements.addressInput.addEventListener('keydown', e => { if(e.key==='Enter') elements.goBtn.click(); });
            elements.backBtn.addEventListener('click', goBack);
            elements.forwardBtn.addEventListener('click', goForward);
            elements.refreshBtn.addEventListener('click', () => {
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, tab.url);
            });

            elements.modeToggle.addEventListener('click', () => {
                const tab = getActiveTab();
                if (!tab) return;
                state.proxyMode = !state.proxyMode;
                tab.mode = state.proxyMode ? 'proxy' : 'iframe';
                elements.modeIcon.textContent = state.proxyMode ? '⚡' : '🖼️';
                elements.modeLabel.textContent = state.proxyMode ? 'Proxy' : 'Direct';
                log(`Toggled to ${tab.mode} mode`, 'info');
                if (tab.url !== 'drake://newtab') navigateTab(tab.id, tab.url, false);
            });

            elements.themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light');
                elements.themeToggle.textContent = document.body.classList.contains('light') ? '🌙' : '☀️';
            });

            elements.bookmarkBar.addEventListener('click', e => {
                const bm = e.target.closest('.bookmark');
                if (!bm) return;
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, bm.dataset.url);
            });

            document.addEventListener('keydown', e => {
                if (e.ctrlKey && e.key === '`') {
                    e.preventDefault();
                    elements.consolePanel.classList.toggle('open');
                }
            });

            window._retry = function() {
                const tab = getActiveTab();
                if (tab) navigateTab(tab.id, tab.url);
            };
            window._benchmark = function() {
                ProxyEngine.benchmark().catch(e => log('Benchmark error: '+e, 'error'));
            };

            // ---- Init ----
            createTab('drake://newtab', 'Home');
            renderTabs();
            log('🚀 Drake Browser ready. Press Ctrl+` for console.', 'info');
            // Auto-benchmark proxies after first load (silently)
            setTimeout(() => ProxyEngine.benchmark().catch(()=>{}), 1000);
        })();
    </script>

    <!-- Optional: Service Worker for persistent cache (advanced) -->
    <script>
        // Register a service worker that caches our rewritten pages for even faster reloads
        if ('serviceWorker' in navigator) {
            // We'll use a minimal inline SW via Blob URL
            const swCode = `
                const CACHE_NAME = 'drake-proxy-cache-v1';
                self.addEventListener('fetch', event => {
                    // Only cache our navigation requests (they have a custom header)
                    if (event.request.headers.get('X-Drake-Proxy')) {
                        event.respondWith(
                            caches.match(event.request).then(cached => {
                                const fetchPromise = fetch(event.request).then(response => {
                                    if (response.ok) {
                                        const clone = response.clone();
                                        caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));
                                    }
                                    return response;
                                });
                                return cached || fetchPromise;
                            })
                        );
                    }
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob), {scope: '/'})
                .then(() => log('📦 SW cache enabled', 'info'))
                .catch(() => log('SW registration failed (normal on some hosts)', 'warn'));
        }
    </script>
