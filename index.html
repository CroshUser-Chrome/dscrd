<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client‑Side Proxy (Service Worker)</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; background: #f8f8f8; }
        .container { max-width: 700px; margin: auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 0.5rem; font-size: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; }
        .note { font-size: 0.9rem; color: #555; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔁 Serverless Static Proxy</h2>
        <p>Enter a full URL and click <em>Go</em>. The target must allow CORS (<code>Access-Control-Allow-Origin</code>) for the HTML document.</p>
        <form id="proxyForm" style="margin: 1rem 0;">
            <input type="url" id="urlInput" placeholder="https://example.com" required />
            <button type="submit">Go</button>
        </form>
        <div class="note">
            <strong>Works with:</strong> sites that set <code>Access-Control-Allow-Origin: *</code>.<br>
            <strong>No server needed</strong> – the Service Worker fetches and rewrites the HTML.
        </div>
    </div>

    <script>
        // ---------- Register the Service Worker from a Blob ----------
        const swCode = `
// Service Worker for client-side proxying
self.addEventListener('install', event => {
    self.skipWaiting();
});
self.addEventListener('activate', event => {
    event.waitUntil(clients.claim());
});

self.addEventListener('fetch', event => {
    const url = new URL(event.request.url);

    // Intercept navigation to our proxy: ?url=<encoded target>
    if (event.request.mode === 'navigate' && url.searchParams.has('url')) {
        event.respondWith(proxyNavigation(url.searchParams.get('url')));
        return;
    }

    // No other requests handled – sub-resources load directly from the target server
});

async function proxyNavigation(targetUrl) {
    try {
        // Fetch the HTML from the target (requires CORS)
        const response = await fetch(targetUrl, { mode: 'cors', redirect: 'follow' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        const html = await response.text();
        const finalBase = response.url; // after redirects

        // Rewrite relative URLs to absolute so sub-resources load directly from target
        const rewrittenHtml = makeAbsoluteUrls(html, finalBase);

        return new Response(rewrittenHtml, {
            headers: { 'Content-Type': 'text/html; charset=utf-8' }
        });
    } catch (err) {
        return new Response(
            \`<h2>Proxy Error</h2><p>CORS may be blocking the request, or the URL is invalid.</p><p><code>\${err.toString()}</code></p>\`,
            { status: 502, headers: { 'Content-Type': 'text/html' } }
        );
    }
}

/**
 * Naive but effective URL rewriter.
 * Converts src, href, action, srcset attributes to absolute URLs.
 */
function makeAbsoluteUrls(html, base) {
    // Attributes whose values might be URLs
    const attrs = ['src', 'href', 'action', 'srcset'];
    const baseUrl = new URL(base);

    // Helper to make a URL absolute (if not already)
    function absolutify(raw) {
        if (!raw || raw.startsWith('data:') || raw.startsWith('blob:') || raw.startsWith('javascript:') || raw.startsWith('#')) return raw;
        try {
            return new URL(raw, baseUrl).href;
        } catch (e) {
            return raw;
        }
    }

    // Process single and double quoted attributes
    attrs.forEach(attr => {
        const regex = new RegExp(\`(\${attr}\s*=\\s*")([^"]*)("\`, 'g);
        html = html.replace(regex, (match, p1, p2, p3) => p1 + absolutify(p2) + p3);
        const regexSingle = new RegExp(\`(\${attr}\s*=\\s*')([^']*)('\`, 'g);
        html = html.replace(regexSingle, (match, p1, p2, p3) => p1 + absolutify(p2) + p3);
    });

    // Also try to set a <base> tag in case we missed anything
    // but injecting base could break absolute links, so we skip it.
    return html;
}
`;

        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl, { scope: '/' })
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.error('SW registration failed:', err));
        } else {
            alert('Service Worker not supported. This proxy requires a modern browser with HTTPS or localhost.');
        }

        // ---------- UI logic ----------
        const form = document.getElementById('proxyForm');
        form.addEventListener('submit', e => {
            e.preventDefault();
            const input = document.getElementById('urlInput').value.trim();
            if (!input) return;
            const encoded = encodeURIComponent(input);
            // Navigate to ourselves with the ?url= parameter
            window.location.href = window.location.origin + window.location.pathname + '?url=' + encoded;
        });

        // If we loaded with a ?url= parameter, the Service Worker already handled it
        // (we shouldn't see this UI unless SW isn't active yet).
    </script>
</body>
</html>
